<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower: Sports Edition</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="home-page">
        <h1>Higher or Lower: Sports Edition</h1>
        <form id="options-form">
            <label for="sport">Choose a sport:</label>
            <select id="sport" name="sport">
                <option value="" selected disabled>Please select</option>
                <option value="mlb">MLB</option>
                <option value="nba">NBA</option>
                <option value="nfl">NFL</option>
                <option value="nhl">NHL</option>
            </select>
            <br><br>
            <label for="stat">Choose a stat:</label>
            <select id="stat" name="stat" disabled>
                <option value="" selected disabled>Please select</option>
            </select>
            <br><br>
            <label>Player Pool:</label>
            <input type="radio" id="current" name="player-pool" value="current" checked>
            <label for="current">Current Players</label>
            <input type="radio" id="all-time" name="player-pool" value="all-time">
            <label for="all-time">All-Time</label>
            <br><br>
            <button type="submit" id="start-btn" disabled>Start Game</button>
        </form>
    </div>

    <div id="game-page" style="display:none;">
        <div class="score-container">
            <div>Score: <span id="current-score">0</span></div>
            <div>High Score: <span id="high-score">0</span></div>
        </div>
        
        <h2 id="stat-title">Stat: </h2>
        
        <div class="player-container">
            <div class="player" id="player1">
                <img id="player1-img" src="" alt="">
                <div class="player-info">
                    <div class="player-name" id="player1-name"></div>
                    <div class="player-pos" id="player1-pos"></div>
                </div>
                <div class="player-stat" id="player1-stat"></div>
            </div>

            <div class="vs">VS</div>

            <div class="player" id="player2">
                <img id="player2-img" src="" alt="">
                <div class="player-info">
                    <div class="player-name" id="player2-name"></div>
                    <div class="player-pos" id="player2-pos"></div>
                </div>
                <div class="player-stat" id="player2-stat"></div>
                <div id="guess-controls">
                    <button id="higher-btn">Higher</button>
                    <button id="lower-btn">Lower</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Game Over Modal -->
    <div id="game-over-modal" style="display:none;">
        <div class="modal-content">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="final-score"></span></p>
            <p>High Score: <span id="modal-high-score"></span></p>
            <p>Stat: <span id="modal-stat"></span></p>
            <div class="modal-buttons">
                <button id="restart-btn">Play Again</button>
                <button id="menu-btn">Back to Menu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
