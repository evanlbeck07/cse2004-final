<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower: Sports Edition</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="home-page">
        <div class="sport-backgrounds">
            <div id="mlb-bg" class="sport-bg-quadrant"></div>
            <div id="nba-bg" class="sport-bg-quadrant"></div>
            <div id="nfl-bg" class="sport-bg-quadrant"></div>
            <div id="nhl-bg" class="sport-bg-quadrant"></div>
        </div>
        <div class="home-content-wrapper">
            <h1>Higher or Lower: Sports Edition</h1>
            <form id="options-form">
                <label for="sport">Choose a sport:</label>
                <select id="sport" name="sport">
                    <option value="" selected disabled>Please select</option>
                    <option value="mlb">MLB</option>
                    <option value="nba">NBA</option>
                    <option value="nfl">NFL</option>
                    <option value="nhl">NHL</option>
                </select>
                <br><br>
                <label for="stat">Choose a stat:</label>
                <select id="stat" name="stat" disabled>
                    <option value="" selected disabled>Please select</option>
                </select>
                <br><br>
                <label>Player Pool:</label>
                <input type="radio" id="current" name="player-pool" value="current" checked>
                <label for="current">Current Players</label>
                <input type="radio" id="all-time" name="player-pool" value="all-time">
                <label for="all-time">All-Time</label>
                <br><br>
                <button type="submit" id="start-btn" class="btn btn--start" disabled>Start Game</button>
            </form>
        </div>
    </div>

    <div id="game-page" style="display:none;">
        <div class="score-container">
            <div>Score: <span id="current-score">0</span></div>
            <div>High Score: <span id="high-score">0</span></div>
        </div>
        
        <h2 id="stat-title">Stat: </h2>
        
        <div class="player-container">
            <div class="player-card left">
                <div class="player-bg" id="player1-bg"></div>
                <img id="player1-img" class="player-headshot" src="" alt="Player 1">
                <div class="player-info">
                    <div class="player-name" id="player1-name"></div>
                    <div class="player-pos" id="player1-pos"></div>
                </div>
                <div class="player-stat" id="player1-stat"></div>
            </div>

            <div class="versus-block" id="vs-indicator">
                <div class="vs-text">VS</div>
                <div class="vs-icon">
                    <!-- Checkmark Icon -->
                    <svg class="icon-correct" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                    <!-- X Icon -->
                    <svg class="icon-incorrect" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                        <path fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" d="M16 16 36 36 M36 16 16 36"/>
                    </svg>
                </div>
            </div>

            <div class="player-card right">
                <div class="player-bg" id="player2-bg"></div>
                <img id="player2-img" class="player-headshot" src="" alt="Player 2">
                <div class="player-info">
                    <div class="player-name" id="player2-name"></div>
                    <div class="player-pos" id="player2-pos"></div>
                </div>
                <div class="player-stat" id="player2-stat"></div>
                <div id="guess-controls">
                    <button id="higher-btn" class="btn btn--higher">Higher</button>
                    <button id="lower-btn" class="btn btn--lower">Lower</button>
                </div>
            </div>
        </div>
    </div>

    <div id="game-over-overlay" style="display:none;">
        <div class="overlay-content">
            <h2>Game Over!</h2>
            <p>Your Score: <span id="final-score"></span></p>
            <p>High Score: <span id="overlay-high-score"></span></p>
            <p>Stat: <span id="overlay-stat"></span></p>
            <div class="overlay-buttons">
                <button id="restart-btn" class="btn">Play Again</button>
                <button id="menu-btn" class="btn">Back to Menu</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
